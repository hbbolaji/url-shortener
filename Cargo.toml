[package]
name = "url_shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
redis = { version = "1.7.1", features = ["tokio-comp", "aio", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["chrono", "macros", "uuid", "postgres", "tls-rustls", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.26.1"
